<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>JAM QR Shield</title>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- Estilos mínimos -->
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    #installed-msg {
      display: none;
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #0078d4;
    }

    #install-btn {
      display: none;
      padding: 12px 20px;
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    #install-btn:hover {
      background: #005fa3;
    }
  </style>
</head>

<body>

  <div id="installed-msg">Abriendo JAM QR Shield…</div>

  <button id="install-btn">Instalar aplicación</button>

  <script src="app.js"></script>
</body>
</html>
